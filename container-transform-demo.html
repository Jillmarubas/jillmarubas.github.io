<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Container Transform Demo</title>
<style>
  :root {
    --bg: #0d0d0f;
    --card-radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: #f2f2f4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 48px 24px;
  }
  h1 {
    font-size: 1.05rem;
    font-weight: 600;
    color: #a3a3ad;
    margin: 0 0 20px;
    max-width: 640px;
    margin-inline: auto;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 14px;
    max-width: 640px;
    margin: 20px auto 0;
  }
  .thumb {
    aspect-ratio: 3 / 4;
    border: none;
    padding: 0;
    border-radius: var(--card-radius);
    cursor: pointer;
    overflow: hidden;
    position: relative;
  }
  .thumb::after {
    content: attr(data-label);
    position: absolute;
    left: 10px;
    bottom: 10px;
    font-size: 0.75rem;
    font-weight: 600;
    color: rgba(255,255,255,.92);
    text-shadow: 0 1px 4px rgba(0,0,0,.45);
  }

  .overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.7);
    backdrop-filter: blur(6px);
    z-index: 20;
  }
  .overlay.open { display: flex; }
  .full {
    width: min(92vw, 480px);
    height: min(86vh, 640px);
    border-radius: 20px;
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
    position: relative;
    overflow: hidden;
  }
  .full .label {
    position: absolute;
    left: 22px;
    bottom: 22px;
    font-size: 1.15rem;
    font-weight: 700;
    color: white;
    text-shadow: 0 2px 8px rgba(0,0,0,.5);
  }
  .close-btn {
    position: absolute;
    top: 22px;
    right: 22px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,.16);
    color: white;
    font-size: 1.1rem;
    cursor: pointer;
    z-index: 21;
  }

  /* ---- This is the part that actually creates the effect ---- */
  ::view-transition-group(doc) {
    animation-duration: 0.4s;
    animation-timing-function: cubic-bezier(0.2, 0, 0.2, 1);
  }

  @media (prefers-reduced-motion: reduce) {
    ::view-transition-group(*),
    ::view-transition-old(*),
    ::view-transition-new(*) {
      animation: none !important;
    }
  }
</style>
</head>
<body>

  <h1>Tap a card — it "container transforms" into a full document. Tap outside (or ✕) to close.</h1>
  <div class="grid" id="grid"></div>

  <div class="overlay" id="overlay">
    <button class="close-btn" id="closeBtn" aria-label="Close">✕</button>
    <div class="full" id="fullView">
      <div class="label" id="fullLabel"></div>
    </div>
  </div>

<script>
  const docs = [
    { label: 'Invoice #204',   color: 'linear-gradient(160deg,#6366f1,#8b5cf6)' },
    { label: 'Contract draft', color: 'linear-gradient(160deg,#f59e0b,#ef4444)' },
    { label: 'Design brief',   color: 'linear-gradient(160deg,#10b981,#0ea5e9)' },
    { label: 'Photo — trip',   color: 'linear-gradient(160deg,#ec4899,#f43f5e)' },
    { label: 'Notes',          color: 'linear-gradient(160deg,#64748b,#334155)' },
    { label: 'Report Q3',      color: 'linear-gradient(160deg,#eab308,#84cc16)' },
  ];

  const grid = document.getElementById('grid');
  const overlay = document.getElementById('overlay');
  const fullView = document.getElementById('fullView');
  const fullLabel = document.getElementById('fullLabel');
  const closeBtn = document.getElementById('closeBtn');

  let activeThumb = null;

  docs.forEach((doc) => {
    const btn = document.createElement('button');
    btn.className = 'thumb';
    btn.style.background = doc.color;
    btn.dataset.label = doc.label;
    btn.addEventListener('click', () => openDoc(btn, doc));
    grid.appendChild(btn);
  });

  function openDoc(thumb, doc) {
    activeThumb = thumb;
    fullView.style.background = doc.color;
    fullLabel.textContent = doc.label;

    // 1. Tag the box we clicked. The browser snapshots THIS
    //    element's position/size as the "before" state.
    thumb.style.viewTransitionName = 'doc';

    const applyChange = () => {
      // 2. Inside the transition callback: move the name onto the
      //    full-screen element and make the real DOM change.
      thumb.style.viewTransitionName = '';
      fullView.style.viewTransitionName = 'doc';
      overlay.classList.add('open');
    };

    if (document.startViewTransition) {
      document.startViewTransition(applyChange);
    } else {
      applyChange(); // older browsers: still works, just no animation
    }
  }

  function closeDoc() {
    if (!activeThumb) return;
    const thumb = activeThumb;

    const applyChange = () => {
      fullView.style.viewTransitionName = '';
      thumb.style.viewTransitionName = 'doc';
      overlay.classList.remove('open');
    };
    const cleanup = () => { thumb.style.viewTransitionName = ''; };

    if (document.startViewTransition) {
      document.startViewTransition(applyChange).finished.then(cleanup);
    } else {
      applyChange();
      cleanup();
    }
  }

  closeBtn.addEventListener('click', closeDoc);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeDoc();
  });
</script>
</body>
</html>
