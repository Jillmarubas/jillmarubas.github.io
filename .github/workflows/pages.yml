name: Deploy site to GitHub Pages

# Publishes the contents of site/ — the live portfolio and CV.
# Everything else in the repo (design-system/, backups/) is versioned but not published.

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you re-publish by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# if two pushes land close together, finish the newer one and drop the older
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
